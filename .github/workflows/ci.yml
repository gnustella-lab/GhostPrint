name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Run behavioral tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Lint Firefox extension
        run: npm run lint

      - name: Build extension archive
        run: npm run build

      - name: Check whitespace errors
        run: git diff --check
